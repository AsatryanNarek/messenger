{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система управління завданнями</title>
<!--    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">-->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="{% static 'css/site.css' %}" rel="stylesheet">
    <style>
    .priority-low {
        background-color: #198754;
        color: white;
    }

    .priority-medium {
        background-color: #ffc107;
        color: black;
    }

    .priority-high {
        background-color: #dc3545;
        color: white;
    }


        .status-todo {
        background-color: #6c757d;
        color: white;
    }

    .status-in_progress {
        background-color: #ffc107;
        color: black;
    }

    .status-done {
        background-color: #198754;
        color: white;
    }

            .task-done {
        background-color: #e2e3e5;
        color: gray;
        opacity: 0.7;
    }

    .task-done a {
        color: gray;
        text-decoration: line-through;
    }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="{% url 'tasks:task-list' %}">Головна</a>
        {% if user.is_authenticated %}
            <form action="{% url 'tasks:logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger">
                    Вихід
                </button>
            </form>
        {% else %}
            <a class="navbar-brand" href="{% url 'tasks:login' %}">Вхід</a>
            <a class="navbar-brand" href="{% url 'tasks:register' %}">Реєстрація</a>
        {% endif %}
    </nav>

    {% block content %}
    {% endblock %}
</body>
</html>
